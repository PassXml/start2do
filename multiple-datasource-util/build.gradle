plugins {
    id 'java'
}

group 'org.start2do'
version '2.0.9.2-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    compileOnly("org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2")
    compileOnly(project(":common-util"))
//    compileOnly("org.mybatis:mybatis:3.5.13")
//    compileOnly 'org.mybatis:mybatis-spring:2.1.2'
}

test {
    useJUnitPlatform()
}
