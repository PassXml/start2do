plugins {
    id 'java-library'
}

group = 'com.zte'
version = rootProject.version

dependencies {
    api project(':plugin-api')

    // 复用已有的多数据源与 MyBatis 工具
    implementation project(':multiple-datasource-util')

    // Spring 基础能力
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-autoconfigure:2.7.18"

    // PF4J
    implementation "org.pf4j:pf4j:3.14.0"

    // MyBatis 核心与 Spring 集成
    implementation "org.mybatis:mybatis:3.5.13"
    implementation "org.mybatis:mybatis-spring:2.1.2"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

