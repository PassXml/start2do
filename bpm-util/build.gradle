plugins {
    id 'java'
    id 'java-library'
}

group = 'org.start2do'
version = '2.0.9.2.12-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    api fileTree(dir: 'libs', include: ['*.jar'])
    api fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly(project(":spring-common"))
    compileOnly(project(":bean-valiate"))
    compileOnly("org.springframework.boot:spring-boot-starter-web:2.7.18") {
        exclude group: "javax.validation", module: "validation-api"
    }
    testImplementation("org.springframework.boot:spring-boot-starter-logging:2.7.18")
    testImplementation("org.springframework.boot:spring-boot-starter-web:2.7.18") {
        exclude group: "javax.validation", module: "validation-api"
    }
    testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: '2.7.18'
    testImplementation("org.springframework.boot:spring-boot-starter-aop:2.7.18")
    testImplementation("org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2")
    testImplementation(project(":spring-common"))
    testImplementation(project(":bean-valiate"))
    testImplementation("org.slf4j:slf4j-api")
    testImplementation("org.slf4j:slf4j-simple")
    testImplementation 'mysql:mysql-connector-java:8.0.28'
}

test {
    useJUnitPlatform()
}
