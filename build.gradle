plugins {
    id 'java'
    id 'maven-publish'
//    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'java-library'
    id 'idea'
    id "io.ebean" version "14.8.1" apply(false)
}
group 'org.start2do'

version '2.0.9.2.12-SNAPSHOT'
allprojects {
    apply {
        plugin 'java'
        plugin 'maven-publish'
        plugin 'java-library'
        plugin "io.ebean"
        plugin "idea"
    }
    repositories {
        maven { url 'https://mirrors.huaweicloud.com/repository/maven/' }
        maven { url 'https://mirrors.163.com/maven/repository/maven-public/' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        mavenCentral()
    }
    ext {
        pushMavenUrl = ""
        SNAPSHOTpushMavenUrl = ""
        lombokVersion = '1.18.22'
        jasperreportsVersion = '6.20.6'
        mapstructVersion = "1.6.3"
        springVersion = "5.3.31"
        ebeanVersion = "14.8.1-javax"
        bouncycastleVertsion = "1.70"
        vertxVersion = '4.3.4'
        springBootVersion = '2.7.18'
        springCloudVersion = '2021.0.9'
        reactorVersion = '3.5.8'
        jacksonVersion = '2.17.0'
        springCloudStarterVersion = '3.1.7'
        springAliCloudVersion = '2021.0.6.2'
        curVersion = project.version == 'unspecified' ? this.rootProject.version : project.version
        jdkVersion = ["ebean-common"          : JavaVersion.VERSION_11,
                      "spring-security-api"   : JavaVersion.VERSION_11,
                      "spring-security-core"  : JavaVersion.VERSION_11,
                      "http-log-sdk"          : JavaVersion.VERSION_11,
                      "sso-login"             : JavaVersion.VERSION_11,
                      "sso-login-test"        : JavaVersion.VERSION_11,
                      "spring-business"       : JavaVersion.VERSION_11,
                      "common-util"           : JavaVersion.VERSION_1_8,
                      "spring-common"         : JavaVersion.VERSION_1_8,
                      "spring-util"           : JavaVersion.VERSION_1_8,
                      "bean-valiate"          : JavaVersion.VERSION_1_8,
                      "script-common"         : JavaVersion.VERSION_11,
                      "script-av-impl"        : JavaVersion.VERSION_11,
                      "script-js-nashorn-impl": JavaVersion.VERSION_11,
                      "script-js-impl"        : JavaVersion.VERSION_17,
                      "bpm-core"              : JavaVersion.VERSION_11,
        ]
    }
    idea.module.sourceDirs += file("${buildDir}/generated/sources/annotationProcessor/java")
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
    compileJava {
        def curJdkVersion = JavaVersion.VERSION_1_8
        for (final def j in jdkVersion) {
            if (j.key == project.name) {
                curJdkVersion = j.value
            }
        }
        sourceCompatibility = curJdkVersion
        targetCompatibility = curJdkVersion
    }
    dependencies {
        testCompileOnly("org.projectlombok:lombok:$lombokVersion")
        compileOnly("org.projectlombok:lombok:$lombokVersion")
        annotationProcessor("org.projectlombok:lombok:$lombokVersion")
        testAnnotationProcessor("org.projectlombok:lombok:$lombokVersion")
        compileOnly("org.mapstruct:mapstruct:$mapstructVersion")
        annotationProcessor("org.mapstruct:mapstruct-processor:$mapstructVersion")
        testAnnotationProcessor("org.mapstruct:mapstruct-processor:$mapstructVersion")
        annotationProcessor("io.ebean:querybean-generator:$ebeanVersion")
        annotationProcessor group: 'org.springframework.boot', name: 'spring-boot-configuration-processor', version: '2.7.18'
        compileOnly("org.springframework.boot:spring-boot-autoconfigure:2.7.18")
        compileOnly group: 'javax.annotation', name: 'javax.annotation-api', version: '1.3.2'
    }

    test {
        useJUnitPlatform()
    }

//    task sourcesJar(type: Jar) {
//        from sourceSets.main.allJava
//        archiveClassifier = 'sources'
//    }

    publishing {
        repositories {
            publications {
                maven(MavenPublication) {
                    groupId = "org.start2do"
                    artifactId = project.name
                    version = curVersion
                    from components.java
//                    artifact sourcesJar
                    versionMapping {
                        usage('java-api') {
                            fromResolutionOf('runtimeClasspath')
                        }
                        usage('java-runtime') {
                            fromResolutionResult()
                        }
                    }
                }
            }
            maven {
                if (curVersion.endsWith('-SNAPSHOT')) {
                    url System.getenv("url")
                } else {
                    url pushMavenUrl
                }
                allowInsecureProtocol true
                credentials {
                    username = System.getenv("user")
                    password = System.getenv("password")
                }
            }
        }
    }
    [compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'
    configurations.all {
        resolutionStrategy {
            def jars = ["org.springframework.integration:spring-integration-webflux": springVersion,
                        "org.springframework.boot:spring-boot-starter-actuator"     : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-mail"         : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-logging"      : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-web"          : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-aop"          : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-data-redis"   : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-cache"        : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-jdbc"         : springBootVersion,
                        "org.springframework.data:spring-data-jdbc"                 : "2.4.18",
                        "org.springframework.boot:spring-boot-starter-webflux"      : springBootVersion,
                        "org.springframework.boot:spring-boot-starter-security"     : springBootVersion,
                        'org.springframework.boot:spring-boot-starter'              : springBootVersion,
                        'org.springframework.boot:spring-boot'                      : springBootVersion,
                        'org.springframework.boot:spring-boot-autoconfigure'        : springBootVersion,
                        "org.springframework:spring-webflux"                        : "5.3.39",
                        "org.springframework:spring-core"                           : "5.3.39",
                        "org.springframework:spring-jdbc"                           : "5.3.39",
                        "org.springframework:spring-context"                        : "5.3.39",
                        "org.springframework:spring-tx"                             : "5.3.39",
                        "org.springframework:spring-webmvc"                         : "5.3.39",
                        "org.springframework.cloud:spring-cloud-context"            : '4.0.2',
                        "org.mybatis.spring.boot:mybatis-spring-boot-starter"       : "2.3.2",
                        "org.springframework.security:spring-security-core"         : "5.7.14",
                        "org.springframework.security:spring-security-cas"          : '5.7.14',
                        "io.minio:minio"                                            : "8.5.7",
                        "org.antlr:stringtemplate"                                  : "4.0.2",
                        "org.mitre.dsmiley.httpproxy:smiley-http-proxy-servlet"     : "2.0",
                        "com.github.ben-manes.caffeine:caffeine"                    : "3.1.8",
                        "com.squareup.okhttp3:okhttp"                               : "4.10.0",
                        "com.squareup.okhttp3:logging-interceptor"                  : "4.10.0",
                        "org.thymeleaf:thymeleaf"                                   : "3.0.9.RELEASE",
                        "com.aliyun:dysmsapi20170525"                               : "2.0.22",
                        "com.alibaba:fastjson"                                      : "1.2.83",
                        "jakarta.servlet:jakarta.servlet-api"                       : "6.0.0",
                        "io.ebean:querybean-generator"                              : ebeanVersion,
                        "io.ebean:ebean"                                            : ebeanVersion,
                        "io.ebean:ebean-api"                                        : ebeanVersion,
                        "io.ebean:ebean-oracle"                                     : ebeanVersion,
                        "io.ebean:ebean-ddl-generator"                              : ebeanVersion,
                        "io.ebean:ebean-querybean"                                  : "14.8.1-javax",
                        "io.ebean:ebean-spring-txn"                                 : "14.8.1-javax",
                        "io.ebean:ebean-redis"                                      : "14.8.1-javax",
                        "org.mapstruct:mapstruct"                                   : mapstructVersion,
                        "com.google.guava:guava"                                    : "33.2.1-jre",
                        "io.ebean:ebean-migration"                                  : "14.2.0",
                        "jakarta.xml.bind:jakarta.xml.bind-api"                     : "2.3.3",
                        "org.glassfish.jaxb:jaxb-runtime"                           : "2.3.6",
                        "com.alibaba:easyexcel"                                     : "4.0.3",
                        "org.slf4j:slf4j-api"                                       : "2.0.5",
                        "org.slf4j:slf4j-simple"                                    : "2.0.5",
                        "org.slf4j:log4j-over-slf4j"                                : "1.7.36",
                        "org.apache.commons:commons-lang3"                          : "3.12.0",
                        "javax.sip:jain-sip-ri"                                     : "1.3.0-91",
                        "org.quartz-scheduler:quartz"                               : "2.3.2",
                        "org.reflections:reflections"                               : "0.10.2",
                        "com.zaxxer:HikariCP"                                       : "5.0.1",
                        "jakarta.persistence:jakarta.persistence-api"               : "3.1.0",
                        "io.projectreactor:reactor-core"                            : reactorVersion,
                        "io.projectreactor.addons:reactor-extra"                    : reactorVersion,
                        "io.reactiverse:reactiverse-contextual-logging"             : "1.1.2",
                        "com.fasterxml.jackson.core:jackson-annotations"            : "2.15.2",
                        "com.fasterxml.jackson.core:jackson-databind"               : "2.15.2",
                        "com.fasterxml.jackson.core:jackson-core"                   : "2.15.2",
                        "com.fasterxml.jackson.dataformat:jackson-dataformat-xml"   : "2.15.2",
                        "jakarta.validation:jakarta.validation-api"                 : "2.0.2",
                        "one.util:streamex"                                         : "0.8.2",
                        "net.bramp.ffmpeg:ffmpeg"                                   : "0.8.0",
                        "io.vertx:vertx-core"                                       : vertxVersion,
                        "io.vertx:vertx-mqtt"                                       : vertxVersion,
                        "io.vertx:vertx-web-client"                                 : vertxVersion,
                        "io.vertx:vertx-web"                                        : vertxVersion,
                        "io.vertx:vertx-mail-client"                                : vertxVersion,
                        "io.vertx:vertx-reactive-streams"                           : vertxVersion,
                        "org.bouncycastle:bcprov-jdk18on"                           : "1.78.1",
                        'commons-io:commons-io'                                     : '2.17.0',
                        'com.aliyun:tea'                                            : '1.1.14',
                        'org.jacoco:org.jacoco.agent'                               : '0.8.4',
                        'commons-beanutils:commons-beanutils'                       : '1.9.4',
                        'commons-logging:commons-logging'                           : '1.2',
                        'org.aspectj:aspectjrt'                                     : '1.9.7',
                        'org.reactivestreams:reactive-streams'                      : '1.0.4',
                        'jakarta.el:jakarta.el-api'                                 : '6.0.1',
                        'commons-codec:commons-codec'                               : '1.16.1',
                        'io.vavr:vavr'                                              : '0.10.4',
                        "javax.validation:validation-api"                           : "2.0.1.Final",
                        "org.apache.poi:poi"                                        : "5.3.0",
                        "org.apache.poi:poi-ooxml-lite"                             : "5.3.0",
                        "org.apache.poi:poi-ooxml"                                  : "5.3.0",
                        "org.graalvm.polyglot:polyglot"                             : "24.1.1",
                        "org.graalvm.polyglot:js"                                   : "24.1.1",
                        "org.graalvm.js:js-scriptengine"                            : "24.1.1",
                        "org.apache.commons:commons-pool2"                          : "2.12.1",
                        "org.apache.commons:commons-compress"                       : "1.27.1",
            ]
            dependencySubstitution {
                for (final def jar in jars) {
                    substitute module(jar.key) using module("${jar.key}:${jar.value}")
                }
            }
        }
    }
}
task cleanTemp(dependsOn: [':clean']) {
    dependsOn ':clean'
}
task buildTaskClass(dependsOn: ['cleanTemp']) {
    dependsOn ':classes'
}
task push(dependsOn: ['buildTaskClass']) {
    dependsOn(":jar")
    dependsOn(":publishMavenPublicationToMavenRepository")
}


