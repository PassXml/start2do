plugins {
    id 'java'
}

group = 'org.start2do'
version = '3.0.6.2-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation(project(':spring-common'))
    implementation(project(':spring-util'))
    implementation(project(':bean-valiate'))
    implementation "org.apache.flink:flink-streaming-java:${flink}"
    implementation "org.apache.flink:flink-cep:${flink}"
    implementation "org.apache.flink:flink-connector-kafka:4.0.0-2.0"
    implementation "org.apache.flink:flink-clients:${flink}"
    implementation "org.apache.flink:flink-streaming-java:${flink}"
    implementation "org.apache.flink:flink-runtime:${flink}"
    implementation 'org.apache.flink:flink-java:1.20.1'
//
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.slf4j:slf4j-api'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
    implementation group: 'io.projectreactor', name: 'reactor-core'

}

test {
    useJUnitPlatform()
}
